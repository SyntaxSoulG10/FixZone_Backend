#Load env vars from .env file
spring.config.import=optional:file:.env

# Database Configuration (Neon)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=300000
spring.datasource.hikari.initialization-fail-timeout=300000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.max-lifetime=120000

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Server Configuration
server.port=${SERVER_PORT:8081}

# Mail Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:admin}
spring.mail.password=${MAIL_PASSWORD:pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Stripe Configuration
stripe.secret-key=${STRIPE_SECRET_KEY}

# Maximum Request Size for Base64 Images
server.tomcat.max-http-form-post-size=100MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ImageKit Configuration
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT}

# Application Security
app.manager.default-password=${MANAGER_DEFAULT_PASSWORD:Manager123!}

# JWT Configuration
jwt.secret=${JWT_SECRET:8a3c8d3e2f1a6c4b7d5e9f8a0b3c2d1e4f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c}
