# Load env vars from .env file
spring.config.import=optional:file:.env[.properties]

# Database Configuration (Loaded securely from .env or CI environment)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false

stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_mock}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_mock}
imagekit.public-key=${IMAGEKIT_PUBLIC_KEY:public_mock}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY:private_mock}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT:https://ik.imagekit.io/fixzone}
